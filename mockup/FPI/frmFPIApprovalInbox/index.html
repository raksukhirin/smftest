<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPI — Approval Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800">

<!-- ===== Top bar ===== -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="px-5 py-2.5 flex items-center gap-3">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold">📥</div>
            <div>
                <div class="text-[10px] uppercase tracking-wider text-slate-500">Freight Pricing Intelligence</div>
                <div class="font-semibold text-sm leading-none">Approval Inbox <span class="text-slate-400">[DEMO]</span></div>
            </div>
        </div>

        <div class="ml-6 flex items-center gap-3 text-xs text-slate-500">
            <span>รออนุมัติ: <span id="statPending" class="font-semibold text-indigo-700 tabular-nums">0</span></span>
            <span>•</span>
            <span>Source: <span id="statSource" class="font-mono text-slate-700">—</span></span>
        </div>

        <div class="ml-auto flex items-center gap-2">
            <span class="text-[11px] text-slate-400">มุมมอง Manager · เคาะ Approve Profit (§6.2)</span>
            <button class="btn-ghost text-xs" id="resetBtn" title="ล้าง workflow ที่บันทึกไว้">↺ Reset</button>
        </div>
    </div>
</header>

<main class="p-4 max-w-5xl mx-auto space-y-3">

    <!-- summary -->
    <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>

    <!-- filter + sort -->
    <div class="flex items-center gap-2 flex-wrap">
        <div id="tabs" class="flex gap-1"></div>
        <div class="ml-auto flex items-center gap-2 text-xs">
            <label class="text-slate-500">เรียง</label>
            <select id="sortSel" class="inp text-xs w-44">
                <option value="worst">Margin แย่สุดก่อน</option>
                <option value="value">มูลค่าดีลสูงสุด</option>
                <option value="shortfall">ห่างเกณฑ์มากสุด</option>
            </select>
        </div>
    </div>

    <!-- batch bar -->
    <div id="batchBar" class="hidden items-center gap-2 rounded-lg bg-indigo-50 border border-indigo-200 px-3 py-2 text-xs">
        <span id="batchCount" class="font-semibold text-indigo-700"></span>
        <button id="batchApprove" class="btn-approve text-xs ml-auto">✓ Approve Profit ที่เลือก</button>
        <button id="batchClear" class="btn-ghost text-xs">ล้างการเลือก</button>
    </div>

    <!-- list -->
    <div id="list" class="space-y-2"></div>
    <div id="empty" class="hidden text-center py-12 text-slate-400 text-sm"></div>
</main>

<!-- ===== reason modal ===== -->
<div id="reasonModal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
        <div class="px-4 py-3 border-b border-slate-200 font-semibold text-sm" id="reasonTitle">อนุมัติ</div>
        <div class="p-4 space-y-3">
            <p id="reasonDesc" class="text-xs text-slate-500 leading-relaxed"></p>
            <textarea id="reasonText" rows="3" class="inp" placeholder="เหตุผล / เงื่อนไข"></textarea>
            <p id="reasonErr" class="hidden text-[11px] text-rose-600">ต้องระบุเหตุผลอย่างน้อย 5 ตัวอักษร</p>
        </div>
        <div class="px-4 py-3 border-t border-slate-200 flex justify-end gap-2">
            <button id="reasonCancel" class="btn-ghost text-xs">ยกเลิก</button>
            <button id="reasonOk" class="btn-primary text-xs">ยืนยัน</button>
        </div>
    </div>
</div>

<!-- Engine + data reused from the Booking Margin Gate module (single source of the margin engine). -->
<script src="../frmFPIBookingGate/data.js"></script>
<script src="../frmFPIBookingGate/src/utils.js"></script>
<script src="../frmFPIBookingGate/src/state.js"></script>
<script src="../frmFPIBookingGate/src/profit.js"></script>
<script src="../frmFPIBookingGate/src/autofill.js"></script>
<!-- Inbox-specific view -->
<script src="src/inbox.js"></script>
<script src="src/app.js"></script>
</body>
</html>
