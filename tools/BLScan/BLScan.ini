; BLScan.ini — ตั้งค่าโปรแกรม BLScan (วางไว้ข้าง BLScan.exe)
; ไฟล์นี้เป็น UTF-8 · บรรทัดที่ขึ้นต้นด้วย ; คือ comment
; อย่า commit ไฟล์ที่ใส่ Password จริงเข้า git

[Database]
; ใส่ ConnectionString เต็มบรรทัดเดียว หรือเว้นว่างแล้วใช้ Server/Database/User/Password ด้านล่าง
ConnectionString=
; Server รูปแบบ host,port  เช่น 192.168.1.10,1433  หรือ  .\SQLEXPRESS
Server=YOUR-SERVER,1433
Database=SMF_DEMO
; เว้นว่าง User = ใช้ Windows Authentication
User=
Password=
Timeout=15

[App]
; ค่าที่เขียนลง SFHBL.USERID / EDITBY / GROUPID
UserID=BLSCAN
GroupID=
SubSysName=SF
DocStat=Open
DocType=Direct
; record อ้างอิง — ใช้เทียบผล scan เท่านั้น โปรแกรมจะไม่ยอมเขียน (dry run ได้)
ReferenceDocNo=SI17110002/005




[OCR]
; ภาษา Windows OCR (ต้องติดตั้ง language pack ใน Windows)
Language=en-US
; ความกว้างภาพ (pixel) ที่ใช้ OCR — PDF จะ render ที่ขนาดนี้, รูปที่เล็กกว่าจะถูกขยาย
RenderWidth=2000
; ความกว้างภาพรอบที่สองสำหรับซ่อมคำที่ OCR ตัดท้าย (เช่น CHINA → CHI) — 0 = ปิด
SecondScale=3000
; หน้าที่จะอ่าน (กรณี PDF หลายหน้า)
Page=1
