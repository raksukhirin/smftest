; SMFDash.ini - settings for SMFDash (place beside SMFDash.exe). UTF-8. Lines starting with ; are comments.
; Do not commit a file that holds a real password. Use the Settings button in the app to save it encrypted.

[Database]
; Server as host,port  e.g. 192.168.1.10,1433  or  .\SQLEXPRESS
Server=
Database=
; empty User = Windows authentication
User=
Password=
Timeout=15

[Approval]
; user name used as the approver in the Approval tab (demo data only for now)
User=TEST

[Alerts]
; display only - what an alert lists is decided by its view (sql\alerts_views.sql)
; colour of the age: amber from WarnDays, red from BadDays
WarnDays=30
BadDays=90
; most rows read from one view
MaxRows=5000
; 1 = do not show alerts that have no items
HideEmpty=0
; minutes between automatic refreshes of the database data, 0 = off
RefreshMin=0
